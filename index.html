<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10152a" />
  <title>Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif; color: #f7f8ff; background: radial-gradient(circle at top, #252056, #10152a 52%, #0e1224); }
    main { max-width: 460px; margin: auto; padding: 22px 18px 48px; }
    header { text-align: center; padding: 20px 0; }
    .logo { font-size: 50px; }
    h1 { font-size: 27px; margin: 5px 0; }
    .sub, .muted { color: #b0b6cf; font-size: 14px; }
    .card { margin: 15px 0; padding: 20px; background: #ffffff10; border: 1px solid #ffffff22; border-radius: 21px; box-shadow: 0 10px 30px #00000021; }
    .card h2 { margin: 0 0 13px; font-size: 18px; }
    #name { font-size: 20px; font-weight: 700; margin: 4px 0; }
    .line { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
    .number { font-size: 40px; font-weight: 800; color: #b19cff; }
    button { width: 100%; border: 0; margin-top: 11px; padding: 15px; border-radius: 12px; background: linear-gradient(105deg,#526dfd,#9154f3); color: white; font-size: 15px; font-weight: 750; cursor: pointer; }
    button.secondary { background: #343b56; }
    button:disabled { opacity: .5; cursor: wait; }
    #status { text-align: center; margin: 18px 0; min-height: 40px; line-height: 1.5; }
  </style>
</head>
<body>
<main>
  <header><div class="logo">🚀</div><h1>Моё Mini App</h1><div class="sub">Профиль игрока + SQLite3</div></header>
  <section class="card">
    <h2>👤 Профиль игрока</h2>
    <p id="name">Загрузка...</p>
    <div class="muted" id="userid">Telegram ID: —</div>
  </section>
  <section class="card">
    <h2>🏆 Прогресс</h2>
    <div class="line"><span>🪙 Монеты</span><strong id="coins">0</strong></div>
    <div class="line" style="margin-top:15px"><span>🎮 Нажатия</span><span class="number" id="clicks">0</span></div>
    <button id="earn">➕ Нажать (+5 монет)</button>
    <button id="reset" class="secondary">🔄 Сбросить нажатия</button>
  </section>
  <section class="card">
    <h2>⚡ Действия</h2>
    <button id="refresh">🔃 Обновить профиль</button>
    <button id="close" class="secondary">✖ Закрыть Mini App</button>
  </section>
  <p id="status" class="muted">Подключение к серверу...</p>
</main>
<script src="./app.js?v=2"></script>
</body>
</html>
