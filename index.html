<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Infinity Estate</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0b0b;
  --bg-2:#121212;
  --panel:#171717;
  --panel-2:#1f1f1f;
  --line:#2d2d2d;
  --text:#ffffff;
  --muted:#b8b8b8;
  --yellow:#ffcc00;
  --yellow-2:#ffd84d;
  --red:#e53935;
  --red-2:#ff5c5c;
  --white:#f7f7f7;
  --ok:#67d48a;
  --danger:#ff6b6b;
  --shadow:0 18px 42px rgba(0,0,0,.38);
  --radius:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%}
body{padding:16px 14px 110px;background:
 radial-gradient(circle at top left, rgba(229,57,53,.14), transparent 26%),
 radial-gradient(circle at top right, rgba(255,204,0,.14), transparent 28%),
 linear-gradient(180deg,#0b0b0b 0%, #111 100%);
}
body.adm{background:
 linear-gradient(180deg,#090909 0%,#0f0f0f 100%);
}
.wrap{max-width:760px;margin:0 auto}
header.mainhead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand-mark{
  width:58px;height:58px;border-radius:18px;display:grid;place-items:center;
  background:linear-gradient(135deg,#1a1a1a,#262626);
  border:1px solid rgba(255,255,255,.06); box-shadow:var(--shadow);
}
.brand-mark svg{width:34px;height:34px}
.brand h1{font-size:24px;margin:0 0 4px;font-weight:900;letter-spacing:.02em}
.brand .sub{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.admin-pill{padding:10px 14px;border-radius:999px;background:linear-gradient(135deg,rgba(255,204,0,.18),rgba(229,57,53,.18));border:1px solid rgba(255,204,0,.24);font-weight:800;color:var(--yellow);display:none;align-items:center;gap:8px;white-space:nowrap}
.admin-pill.show{display:flex}
.moneybar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.statbox{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.statbox .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px}
.statbox .value{font-size:28px;font-weight:900;display:flex;align-items:center;gap:8px}
.statbox .value.yellow{color:var(--yellow)}
.statbox .value.white{color:var(--white)}
.panel{background:linear-gradient(180deg,rgba(24,24,24,.95),rgba(17,17,17,.98));border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin:12px 0}
.panel h2{margin:0 0 10px;font-size:20px}
.panel h3{margin:0 0 8px;font-size:16px}
.m{color:var(--muted);font-size:13px;line-height:1.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.moneybar{grid-template-columns:1fr}}
button{border:0;outline:none;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,#2a2a2a,#1a1a1a);border:1px solid #333;transition:.16s transform,.16s opacity,.16s border-color,.16s background;box-shadow:none}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:linear-gradient(135deg,var(--yellow),#ffb300);color:#1a1a1a;border-color:#ffcf33}
button.red{background:linear-gradient(135deg,var(--red),#c62828);border-color:#ef5350}
button.light{background:linear-gradient(135deg,#ffffff,#ececec);color:#111;border-color:#ffffff}
button.alt{background:linear-gradient(135deg,#232323,#1b1b1b);border-color:#3a3a3a}
button.ghost{background:#141414;border-color:#2b2b2b;color:#ddd}
button.big{width:100%;padding:16px 18px;font-size:16px;border-radius:18px}
input,textarea,select{background:#101010;border:1px solid #303030;border-radius:14px;color:#fff;padding:12px 14px;font-size:14px;min-width:0;width:100%}
input::placeholder,textarea::placeholder{color:#777}
.tag{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:#141414;border:1px solid #2e2e2e;font-size:13px;font-weight:700}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:stretch}
@media (max-width:700px){.hero{grid-template-columns:1fr}}
.house-card{position:relative;overflow:hidden}
.house-card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,204,0,.07),transparent 40%,rgba(229,57,53,.07));pointer-events:none}
.house-box{display:grid;place-items:center;padding:10px 0}
.house-box svg{width:min(320px,100%);height:auto;filter:drop-shadow(0 12px 28px rgba(0,0,0,.4))}
.lvl{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:#111;border:1px solid #333;border-radius:999px;font-size:13px;font-weight:800;color:var(--yellow)}
.prog{height:12px;border-radius:999px;background:#111;border:1px solid #292929;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),#ffdf5a,var(--red));box-shadow:0 0 24px rgba(255,204,0,.35)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.metrics .mini{padding:12px;border-radius:16px;background:#121212;border:1px solid #2b2b2b}
.metrics small{display:block;color:#949494;text-transform:uppercase;font-size:11px;letter-spacing:.08em;margin-bottom:6px}
.metrics b{font-size:18px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.cards{grid-template-columns:1fr}}
.card{padding:16px;border-radius:20px;background:linear-gradient(180deg,#1a1a1a,#111);border:1px solid #2d2d2d;cursor:pointer;min-height:110px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.card:hover{border-color:#444}
.card i{font-style:normal;font-size:32px}.card b{font-size:16px}.card small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:10px 14px;border-radius:999px;background:#141414;border:1px solid #303030;font-size:13px;font-weight:800;cursor:pointer}.chip.on{background:linear-gradient(135deg,var(--yellow),#ffb300);color:#111;border-color:#ffd54f}
.rangebox{margin-top:12px;background:#111;padding:14px;border:1px solid #2d2d2d;border-radius:18px}
input[type=range]{padding:0;accent-color:var(--red)}
.mines-layout{display:grid;grid-template-columns:1fr;gap:12px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.cell{aspect-ratio:1;border-radius:18px;border:1px solid #353535;background:linear-gradient(180deg,#242424,#171717);font-size:22px;font-weight:900;color:#fff;box-shadow:inset 0 -3px 0 rgba(255,255,255,.05)}
.cell.safe{background:linear-gradient(180deg,#fff4cc,#ffd95c);color:#111;border-color:#ffde6b}
.cell.mine{background:linear-gradient(180deg,#ff6b6b,#c62828);border-color:#ff8a80}
.mines-head{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pillbox{padding:12px;border-radius:16px;background:#111;border:1px solid #2b2b2b}.pillbox small{display:block;color:#8c8c8c;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.pillbox b{display:block;margin-top:5px;font-size:18px}
.case-drop{padding:16px;border-radius:18px;background:linear-gradient(135deg,rgba(255,204,0,.14),rgba(229,57,53,.14));border:1px solid rgba(255,204,0,.25);text-align:center}
.car{display:flex;align-items:center;gap:10px;background:#111;border:1px solid #2d2d2d;padding:12px 14px;border-radius:16px;margin-top:8px}.car button{margin-left:auto}
.top-item{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;background:#111;border:1px solid #2d2d2d;padding:12px 14px;border-radius:16px;margin-top:8px}.top-item.me{border-color:rgba(255,204,0,.5);background:linear-gradient(135deg,rgba(255,204,0,.08),#111)}
.profile-head{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}.profile-avatar{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,rgba(255,204,0,.15),rgba(229,57,53,.15));border:1px solid rgba(255,255,255,.08)}
.profile-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.profile-stats .mini{padding:12px;border-radius:16px;background:#111;border:1px solid #2d2d2d}
.avatar-row button{font-size:24px;padding:10px 14px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,10,.94);backdrop-filter:blur(16px);border-top:1px solid #262626;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:20}
nav button{flex:1;max-width:120px;border-radius:16px;background:transparent;border-color:transparent;padding:10px 4px;color:#9e9e9e;font-size:11px}
nav button b{display:block;font-size:20px;margin-bottom:3px}
nav button.on{background:linear-gradient(180deg,rgba(255,204,0,.16),rgba(229,57,53,.08));color:#fff;border-color:rgba(255,255,255,.06)}
#status{position:fixed;left:14px;right:14px;bottom:88px;max-width:732px;margin:auto;padding:14px 16px;border-radius:18px;background:rgba(15,15,15,.96);border:1px solid rgba(255,204,0,.28);display:none;z-index:30;box-shadow:var(--shadow);font-size:14px}
#status:not(:empty){display:block}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.kpi .item{padding:14px;border-radius:18px;background:#101010;border:1px solid #282828}.kpi small{display:block;color:#8f8f8f;text-transform:uppercase;font-size:11px;letter-spacing:.08em;margin-bottom:6px}.kpi b{font-size:20px}
@media (max-width:760px){.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media (max-width:760px){.cols{grid-template-columns:1fr}}
.diag-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media (max-width:640px){.diag-grid{grid-template-columns:1fr}}
.diag-card{padding:14px;border-radius:18px;background:#101010;border:1px solid #282828}.diag-card.ok{border-color:rgba(103,212,138,.35)}.diag-card.fail{border-color:rgba(255,107,107,.35)}
.diag-line{display:flex;align-items:center;gap:10px}.diag-dot{width:12px;height:12px;border-radius:50%}.diag-dot.ok{background:var(--ok);box-shadow:0 0 16px rgba(103,212,138,.45)}.diag-dot.fail{background:var(--danger);box-shadow:0 0 16px rgba(255,107,107,.45)}
.info-list{display:grid;gap:8px}.info-row{padding:11px 12px;border-radius:14px;background:#101010;border:1px solid #282828}.info-row small{display:block;color:#8f8f8f;margin-bottom:4px}
.admin-banner{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:20px;background:linear-gradient(135deg,rgba(255,204,0,.12),rgba(229,57,53,.12));border:1px solid rgba(255,204,0,.22)}
.inf-logo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:#111;border:1px solid #2d2d2d}.inf-logo svg{width:34px;height:34px}
.tw{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th{padding:10px;text-align:left;color:#8f8f8f;text-transform:uppercase;font-size:11px;border-bottom:1px solid #303030}td{padding:10px;border-bottom:1px solid #242424;vertical-align:top}tr.bl td{background:rgba(229,57,53,.08)}
.inline-actions{display:flex;flex-wrap:wrap;gap:6px}
.empty{padding:18px;border-radius:18px;background:#111;border:1px dashed #303030;text-align:center;color:var(--muted)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.section-title .m{margin:0}
.admin-only{display:none}
body.adm .admin-only{display:block}
</style>
</head>
<body>
<main class="wrap">
  <header class="mainhead">
    <div class="brand">
      <div class="brand-mark" id="brandMark">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 31 32 11l22 20v22H10V31Z" fill="#FFCC00"/>
          <path d="M18 31h28v22H18V31Z" fill="#fff"/>
          <path d="M28 39h8v14h-8V39Z" fill="#E53935"/>
          <path d="M22 36h4v5h-4Zm16 0h4v5h-4Z" fill="#111"/>
        </svg>
      </div>
      <div>
        <h1 id="brandTitle">Infinity Estate</h1>
        <div class="sub" id="brandSub">business control panel</div>
      </div>
    </div>
    <div class="admin-pill" id="adminPill">∞ Админ · бесконечные ресурсы</div>
  </header>

  <section class="moneybar">
    <div class="statbox">
      <div class="label">Баланс</div>
      <div class="value white">$ <span id="coins">—</span></div>
    </div>
    <div class="statbox">
      <div class="label">Ресурс</div>
      <div class="value yellow">⭐ <span id="gems">—</span></div>
    </div>
  </section>

  <div id="view"><div class="panel"><div class="m">Загрузка...</div></div></div>
</main>
<div id="status"></div>
<nav id="nav"></nav>
<script src="./app.js?v=20261025-redesign"></script>
</body>
</html>
